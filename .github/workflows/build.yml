# DeltaRay — CI/CD for the combined L×Box + ZeroDPI APK.
#
# Triggers:
#   1) Tag push (v*):            checks → build → GitHub Release with APKs
#                                (arm64-v8a + armeabi-v7a)
#   2) push main / PR → main:    checks only
#   3) workflow_dispatch:        checks | build (+release if run on a tag)
#
# Build plan:
#   * ZeroDPI Rust runtime is cross-compiled (build.py --android-skip-apk)
#     into src/zerodpi/dist/android-app/full (jniLibs + assets).
#   * The L×Box Flutter app embeds ZeroDPI as an Android library module
#     (:zerodpi) and picks the runtime from $ZERODPI_RUNTIME_DIR.

name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            # Non-tag build: pin to the last release tag, Git-versioned.
            TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            if [ -n "$TAG" ]; then
              SINCE="$(git rev-list "${TAG}..HEAD" --count)"
              VERSION="${TAG#v}-dev.${SINCE}"
            else
              VERSION="dev-$(git rev-parse --short=7 HEAD)"
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/lxbox/app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Flutter version pin
        id: flutter_pin
        run: echo "version=$(tr -d '[:space:]' < android/flutter.version)" >> "$GITHUB_OUTPUT"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Build APK (${{ matrix.abi }})
    if: startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
    needs: [meta]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            flutter_target: android-arm64
          - abi: armeabi-v7a
            flutter_target: android-arm
    env:
      ZERODPI_RUNTIME_DIR: ${{ github.workspace }}/src/zerodpi/dist/android-app/full
      ZERODPI_ABI: ${{ matrix.abi }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build ZeroDPI Android runtime (full / ${{ matrix.abi }})
        working-directory: src/zerodpi
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py --platform android \
            --android-app-abi ${{ matrix.abi }} \
            --android-app-runtime full \
            --android-app-build-type debug \
            --android-skip-apk
        env:
          CARGO_TERM_COLOR: always

      - name: Fetch sing-box-lx core (libbox.aar)
        working-directory: src/lxbox
        run: ./scripts/fetch-libbox.sh

      - name: Flutter version pin
        id: flutter_pin
        working-directory: src/lxbox/app
        run: echo "version=$(tr -d '[:space:]' < android/flutter.version)" >> "$GITHUB_OUTPUT"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true

      - name: Inject release version from tag
        working-directory: src/lxbox/app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="0.0.0-${VERSION}"
            CODE_VERSION="0.0.0"
          else
            CODE_VERSION="$VERSION"
          fi
          BUILD_NUMBER=$(../scripts/version-code.sh "$CODE_VERSION" ${{ matrix.abi }})
          sed -i.bak -E "s/^version: .*/version: $VERSION+$BUILD_NUMBER/" pubspec.yaml
          rm -f pubspec.yaml.bak
          echo "Injected: $VERSION+$BUILD_NUMBER"
          {
            echo "VERSION_NAME=$VERSION"
            echo "CODE_VERSION=$CODE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Dependencies
        working-directory: src/lxbox/app
        run: flutter pub get

      - name: Android release keystore (optional)
        working-directory: src/lxbox/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_STORE_TYPE }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            if [ "${{ needs.meta.outputs.is_release }}" = "true" ]; then
              echo "::error::Release build requires the ANDROID_KEYSTORE_BASE64 secret — refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "No ANDROID_KEYSTORE_BASE64 secret; non-release APK will use debug signing."
            exit 0
          fi
          : "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD when BASE64 is set}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD when BASE64 is set}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS when BASE64 is set}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
            echo "storeType=${ANDROID_KEYSTORE_STORE_TYPE:-PKCS12}"
          } > android/key.properties

      - name: Build combined APK (${{ matrix.abi }})
        working-directory: src/lxbox/app
        env:
          LXBOX_ABI_FILTER: ${{ matrix.abi }}
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(../scripts/version-code.sh "$CODE_VERSION" ${{ matrix.abi }})
          mkdir -p "$GITHUB_WORKSPACE/build"
          LOG="$GITHUB_WORKSPACE/build/flutter-build.log"
          set +e
          flutter build apk --release \
            --target-platform ${{ matrix.flutter_target }} \
            --build-name "$VERSION_NAME" --build-number "$CODE" \
            2>&1 | tee "$LOG" | tail -200
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "flutter build exit: $STATUS"
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          OUT=build/app/outputs/flutter-apk
          mv "$OUT/app-release.apk" "$OUT/app-${{ matrix.abi }}-release.apk"
          ls -la "$OUT"

      - name: Verify APK (package id + signature)
        working-directory: src/lxbox/app
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK/build-tools" ]; then
            echo "::error::Android SDK build-tools not found (SDK='$SDK')"
            exit 1
          fi
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          echo "== package =="
          "$AAPT" dump badging "$APK" | grep -E "^package:|^application-label:" || true
          if ! "$AAPT" dump badging "$APK" | grep -q "package: name='com.deltakronecker.deltaray'"; then
            echo "::error::Unexpected applicationId in APK (expected com.deltakronecker.deltaray)"
            exit 1
          fi
          echo "== signature =="
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with the Android debug key"
            exit 1
          fi
          echo "OK: ${{ matrix.abi }} signed with the release key"

      - name: Publish build diagnostics (on failure)
        if: failure()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build/flutter-build.log"
          if [ -f "$LOG" ]; then
            echo "::group::tail"
            tail -200 "$LOG" | sed 's/%/%25/g; s/\r$//'
            echo "::endgroup::"
          else
            echo "::error::flutter-build.log was not produced"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.abi }}
          path: src/lxbox/app/build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 30 }}

  release:
    name: Create Release
    needs: [meta, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.meta.outputs.is_release == 'true'
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: android-apk-*
          path: release-artifacts
          merge-multiple: true

      - name: Prepare APKs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          for abi in arm64-v8a armeabi-v7a; do
            SRC=$(find release-artifacts/ -name "app-${abi}-release.apk" -type f | head -1)
            if [ -z "$SRC" ]; then
              echo "ERROR: ${abi} APK not found!"
              exit 1
            fi
            cp "$SRC" "DeltaRay-${VERSION}-${abi}.apk"
          done
          ls -la DeltaRay-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: DeltaRay ${{ needs.meta.outputs.version }}
          draft: false
          overwrite_files: true
          files: |
            DeltaRay-${{ needs.meta.outputs.version }}-arm64-v8a.apk
            DeltaRay-${{ needs.meta.outputs.version }}-armeabi-v7a.apk